<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charades Secret Word Assigner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 1rem;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .game-area {
            margin-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
            padding-top: 1.5rem;
        }
        .player-box {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .player-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .word-display {
            font-size: 1.25rem;
            font-weight: bold;
            color: #059669;
            margin: 0.5rem 0;
            min-height: 1.8rem;
        }
        .reveal-btn {
            background-color: #4b5563;
            padding: 0.5rem;
            font-size: 0.875rem;
        }
        .reveal-btn:hover {
            background-color: #374151;
        }
        .error {
            color: #dc2626;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Charades Word Assigner</h1>
    
    <label for="wordList">Enter Words/Names (one per line):</label>
    <textarea id="wordList">Spider-Man
Batman
SpongeBob
Harry Potter
Sherlock Holmes
Pikachu
Shrek
Yoda</textarea>
    
    <div id="errorMessage" class="error"></div>
    <button onclick="generateWords()">Generate Secret Words</button>
    
    <div class="game-area">
        <div class="player-box">
            <div class="player-title">Player 1 (Your Friend)</div>
            <p style="font-size: 0.85rem; color: #6b7280; margin: 0;">This is the word YOU must guess</p>
            <div id="p1Word" class="word-display">---</div>
            <button id="p1Btn" class="reveal-btn" onclick="toggleReveal('p1Word', 'p1Btn')">Reveal Word</button>
        </div>
        
        <div class="player-box">
            <div class="player-title">Player 2 (You)</div>
            <p style="font-size: 0.85rem; color: #6b7280; margin: 0;">This is the word YOUR FRIEND must guess</p>
            <div id="p2Word" class="word-display">---</div>
            <button id="p2Btn" class="reveal-btn" onclick="toggleReveal('p2Word', 'p2Btn')">Reveal Word</button>
        </div>
    </div>
</div>

<script>
    let player1Secret = "";
    let player2Secret = "";
    let p1Hidden = true;
    let p2Hidden = true;

    function generateWords() {
        const text = document.getElementById('wordList').value;
        const errorDiv = document.getElementById('errorMessage');
        
        // Split by lines and remove empty lines
        const words = text.split('\n')
                          .map(w => w.trim())
                          .filter(w => w.length > 0);
        
        // Validation
        if (words.length < 2) {
            errorDiv.textContent = "Please enter at least 2 distinct words!";
            errorDiv.style.display = "block";
            return;
        }
        errorDiv.style.display = "none";
        
        // Pick two random distinct words
        const index1 = Math.floor(Math.random() * words.length);
        let index2 = Math.floor(Math.random() * words.length);
        
        while (index1 === index2 && words.length > 1) {
            index2 = Math.floor(Math.random() * words.length);
        }
        
        player1Secret = words[index1];
        player2Secret = words[index2];
        
        // Reset the UI to hidden state
        p1Hidden = true;
        p2Hidden = true;
        document.getElementById('p1Word').textContent = "*** HIDDEN ***";
        document.getElementById('p1Btn').textContent = "Reveal Word";
        document.getElementById('p2Word').textContent = "*** HIDDEN ***";
        document.getElementById('p2Btn').textContent = "Reveal Word";
    }

    function toggleReveal(elementId, buttonId) {
        if (elementId === 'p1Word') {
            if (!player1Secret) return;
            p1Hidden = !p1Hidden;
            document.getElementById(elementId).textContent = p1Hidden ? "*** HIDDEN ***" : player1Secret;
            document.getElementById(buttonId).textContent = p1Hidden ? "Reveal Word" : "Hide Word";
        } else {
            if (!player2Secret) return;
            p2Hidden = !p2Hidden;
            document.getElementById(elementId).textContent = p2Hidden ? "*** HIDDEN ***" : player2Secret;
            document.getElementById(buttonId).textContent = p2Hidden ? "Reveal Word" : "Hide Word";
        }
    }
</script>

</body>
</html>
